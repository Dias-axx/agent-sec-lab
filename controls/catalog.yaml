# Control catalog. Framework references are IDs only (informal mapping, no framework text).
# Rationale per mapping: docs/controls-mapping.md
version: 1
controls:
  - id: CM-01
    title: Branch protection with required reviews on default branch
    frameworks:
      soc2: [CC6.1, CC8.1]
      iso27001: [A.8.4, A.8.32]
    severity: high
    collector: github
    check: branch_protection_enabled
    params:
      required_reviews: 1
      allow_bypass: false   # true = accept admins/actors that can bypass reviews
    evidence: [api_response_excerpt, timestamp, repo, endpoint]
    remediation: >-
      Protect the default branch (classic protection or a ruleset), require at least the
      configured number of approving pull-request reviews, and do not let admins bypass it
      (classic: "Do not allow bypassing" / enforce_admins; rulesets: empty bypass list).

  - id: AC-01
    title: Two-factor authentication required for organisation members
    frameworks:
      soc2: [CC6.1]
      iso27001: [A.5.17, A.8.5]
    severity: critical
    collector: github
    check: org_mfa_required
    evidence: [api_response_excerpt, timestamp, org, endpoint]
    remediation: Enable "Require two-factor authentication" in the organisation security settings.

  - id: DP-01
    title: Secret scanning and push protection enabled
    frameworks:
      soc2: [CC6.1, CC7.1]
      iso27001: [A.5.17, A.8.12]
    severity: high
    collector: github
    check: secret_scanning_enabled
    params: {require_push_protection: true}
    evidence: [api_response_excerpt, timestamp, repo, endpoint]
    remediation: Enable secret scanning and push protection for every repository.

  - id: VM-01
    title: Dependabot vulnerability alerts enabled
    frameworks:
      soc2: [CC7.1]
      iso27001: [A.8.8]
    severity: medium
    collector: github
    check: dependabot_alerts_enabled
    evidence: [api_response_excerpt, timestamp, repo, endpoint]
    remediation: Enable Dependabot alerts for every repository (org default for new repos).

  - id: AC-02
    title: No public repositories unless allowlisted
    frameworks:
      soc2: [CC6.1, C1.1]
      iso27001: [A.5.15, A.8.4]
    severity: high
    collector: github
    check: no_public_repos
    params:
      # repository names (without org prefix, case-insensitive) intentionally public
      allowlist:
        - CodeReview   # lab repo in test org, public to use Free-plan protection features
    evidence: [api_response_excerpt, timestamp, repo, endpoint]
    remediation: Make the repository private/internal, or add it to the allowlist with a documented reason.

  - id: SC-01
    title: GitHub Actions references pinned to full commit SHAs
    frameworks:
      soc2: [CC8.1, CC9.2]
      iso27001: [A.5.21, A.8.28]
    severity: medium
    collector: github
    check: actions_pinned_shas
    evidence: [api_response_excerpt, timestamp, repo, endpoint]
    remediation: >-
      Replace tag/branch references (e.g. @v4) with the full 40-character commit SHA and keep
      the tag as a trailing comment; pin docker:// images by digest.

  - id: AC-03
    title: Default GITHUB_TOKEN permissions are read-only
    frameworks:
      soc2: [CC6.1, CC6.3]
      iso27001: [A.8.2, A.8.9]
    severity: high
    collector: github
    check: actions_default_token_read_only
    params: {allow_pr_approval: false}
    evidence: [api_response_excerpt, timestamp, org, repo, endpoint]
    remediation: >-
      Set "Workflow permissions" to "Read repository contents and packages permissions" and
      disable "Allow GitHub Actions to create and approve pull requests" at org and repo level.

  - id: CM-02
    title: CODEOWNERS file present and valid
    frameworks:
      soc2: [CC8.1]
      iso27001: [A.8.32]
    severity: low
    collector: github
    check: codeowners_present
    evidence: [api_response_excerpt, timestamp, repo, endpoint]
    remediation: Add a syntactically valid CODEOWNERS file under .github/, the root, or docs/.

  - id: AC-04
    title: Organisation owner count within threshold
    frameworks:
      soc2: [CC6.2, CC6.3]
      iso27001: [A.5.18, A.8.2]
    severity: medium
    collector: github
    check: org_admin_count
    params: {min_admins: 2, max_admins: 3}
    evidence: [api_response_excerpt, timestamp, org, endpoint]
    remediation: >-
      Keep between min_admins (avoid single point of failure) and max_admins organisation owners;
      grant narrower roles otherwise.
